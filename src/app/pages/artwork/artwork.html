@if (artwork) {
  <article class="artwork-page" id="artwork-page">
    <a aria-label="Close artwork details" class="artwork-back" routerLink="/">×</a>
    <div class="artwork-image-wrapper">
      <img (click)="openFullscreen()"
           [alt]="artwork.alt"
           [src]="artwork.image"
           class="artwork-image"
      >
    </div>
    @if (isFullScreen) {
      <img (click)="closeFullscreen()"
           [alt]="artwork.alt" [src]="artwork.image" class="artwork-image-fullscreen"/>
    }
    <div class="artwork-content">
      <header>
        <div class="artwork-heading">
          <h1>{{ artwork.title }}</h1>
          <span>{{ artwork.year }}</span>
        </div>

        <div class="artwork-meta">
          {{ artwork.meta }}
        </div>
      </header>

      <div class="artwork-description">
        @for (paragraph of artwork.description; track paragraph) {
          <p>{{ paragraph }}</p>
        }
      </div>
    </div>
